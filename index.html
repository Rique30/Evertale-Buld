<style>
:root{color-scheme:dark;--bg:#080e1b;--panel:#121d30;--line:#293a53;--muted:#a7b8cd;--gold:#edc873;--blue:#73cce7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#243b57 0%,transparent 43%),var(--bg);color:#edf5fc;font:15px/1.5 Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid #36526f;border-radius:10px;background:#233951;color:#f3f8ff;padding:9px 13px;cursor:pointer}button:hover{background:#33516f}button.primary{background:#276e82;border-color:#48b5ce}button.danger{color:#ffb4ae}input,select,textarea{width:100%;background:#0b1626;border:1px solid #354861;border-radius:9px;padding:10px;color:#f1f8ff}textarea{min-height:72px}label{display:block;color:#b9cadd;font-size:12px;margin-bottom:5px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{border-right:1px solid var(--line);background:#0a1425e8;padding:22px 13px}.logo{font:700 22px Georgia,serif;color:var(--gold);padding:8px 10px 24px}.logo small{display:block;font:12px system-ui;color:var(--muted)}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;margin:3px 0;padding:13px}nav button.active{color:#8ceaff;background:#1b3447}main{padding:28px;max-width:1510px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:23px}h1{font:700 32px Georgia,serif;margin:0;color:#fff2d0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}p{color:var(--muted)}.note{color:#afc7d9;font-size:13px}.panel{background:linear-gradient(145deg,#17243a,#101a2b);border:1px solid #30415b;border-radius:17px;padding:20px;margin-bottom:18px;box-shadow:0 12px 38px #0002}.stats,.cards,.split,.fields{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats strong{font-size:27px;color:var(--gold)}.stats span{display:block;color:var(--muted);font-size:12px}.cards{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}.character{background:#0f1c30;border:1px solid #38516d;border-radius:13px;padding:15px;position:relative}.character .avatar{height:66px;width:66px;display:grid;place-items:center;font-size:29px;border:1px solid #5b7890;background:#1c3550;border-radius:14px;margin-bottom:9px}.character b{display:block}.character small{color:var(--muted)}.tag{display:inline-block;border:1px solid #67718d;border-radius:7px;font-size:11px;color:#f4d38d;padding:1px 6px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.split{grid-template-columns:1fr 1fr}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{max-width:300px}.toolbar select{width:auto;min-width:150px}.stack{display:grid;gap:10px}.item{border:1px solid #344861;border-radius:11px;padding:13px;background:#101b2c}.item strong{color:#fff}.muted{color:var(--muted)}.progress{height:9px;background:#203149;border-radius:20px;overflow:hidden}.progress i{display:block;background:linear-gradient(90deg,#3cabc0,#c8dca4);height:100%}.teamgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.slot{background:#102137;border:1px dashed #496583;padding:13px;border-radius:11px}.slot select{margin-top:6px}.hidden{display:none!important}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #2c415a}th{font-size:12px;color:var(--muted)}.hint{background:#142c3a;padding:12px;border-left:3px solid #72d2dd;border-radius:5px}.status{padding:8px 12px;border-radius:9px;color:#b6f4c4;min-height:20px}.dangerText{color:#ffb2a5}footer{padding:10px 0;color:#95a8c0;font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:8px;position:static}.logo{padding:8px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.teamgrid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}@media(max-width:550px){.fields{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}.teamgrid{grid-template-columns:1fr}}

</head><body>
<div class="layout"><aside><div class="logo">✦ Evertale Manager <small>Seu inventário, seu progresso</small></div><nav id="nav"></nav></aside>
<main><div class="top"><div><h1 id="title">Visão geral</h1><div class="note">Gerencie sua coleção e planeje seus próximos upgrades.</div></div><div class="row"><button onclick="exportData()">↓ Exportar backup</button><button onclick="document.getElementById('importFile').click()">↑ Importar backup</button><input hidden type="file" id="importFile" accept=".json,application/json" onchange="importData(event)"/></div></div><div id="app"></div><div id="modalRoot"></div><div class="status" id="status"></div><footer>Projeto independente de fãs. Não afiliado à ZigZaGame. Personagens e custos são editáveis; confirme valores no jogo. Dados salvos neste navegador.</footer></main></div>
<script>
const KEY='evertale-manager-v1';
const names=[
['Perry — Admiral of Debt','Água',100,'SSR'],['Dark Lancelot — Black-Hearted Gunslinger','Trevas',1,'SSR'],['Hibiki — Scarlet Oni Samurai','Luz',180,'SSR'],['Rizette — Bashful Bunnygirl','Água',120,'SSR'],['Sleeping Beauty — Lakeside Reverie','Água',80,'SSR'],['Rolotia — Lady of Eternal Summer','Água',100,'SSR'],['Alice — The Eternal Dream','Água',80,'SSR'],['Haku','Luz',80,'SSR'],['Mirai — Sparkling Idol','Luz',100,'SSR'],['Queen of Hearts — Red Arbiter','Fogo',1,'SSR'],['Basilisk — Master of Wraiths','Trevas',1,'SSR'],['Freya — Goddess of Love and War','Fogo',100,'SSR'],['Shanna — Red Riding Hood','Fogo',80,'SSR'],['Astrid — Red Dragon Heiress','Fogo',80,'SSR'],['Honnoji','Fogo',80,'SSR'],['Lucifer — Seed of Evil','Trevas',1,'SSR'],['Callen — Brilliant Magic Researcher Girl','Raio',120,'SSR'],['Elmina — Violet-Eyed Assassin','Trevas',120,'SSR'],['Rei — Sakura Onmyoji','Raio',100,'SSR'],['Orzachron','Raio',80,'SSR'],['Ossia — The Hollow Heart','Trevas',100,'SSR'],['Le Fay — The Witch of Avalon','Trevas',80,'SSR'],['Dark Alice — One More Nightmare','Trevas',80,'SSR'],['Gawain — Round Table Knight','Luz',80,'SSR'],['Vonn — Bearer of the Demon Maul','Trevas',80,'SR'],['Elmina — Sunkissed Mirage','Água',120,'SSR'],['Momoka — Mysterious Shrine Maiden','Luz',80,'SSR'],['Artimeia — Lady of the White Moon','Luz',80,'SSR'],['Napoleon — The Perfect Empress','Água',1,'SSR'],['Odin — Goddess of All Laws','Raio',1,'SSR'],['Kirin — Mythweaver','Terra',1,'SSR'],['Murasaki Shikibu — Weaver of Tales','Trevas',1,'SSR'],['Clarice — Full-Throttle Racer','Raio',1,'SSR'],['Imran — The Walking Storm','Raio',1,'SR'],['Vesh — Will of the Soil','Terra',1,'SR'],['Jeanne d’Arc — Valentine’s Day Maiden','Luz',120,'SSR'],['Alira','Água',80,'SSR'],['Zamal','Fogo',40,'SR']];
const uid=()=>Math.random().toString(36).slice(2,11);
const fresh=()=>({characters:names.map(([name,element,level,rarity])=>({id:uid(),name,element,level,rarity,owned:true,limit:level<=80?80:Math.ceil(level/20)*20,awakenings:0,weaponId:'',notes:''})),weapons:[{id:uid(),name:'Dark Remnant',type:'A confirmar',level:60,passive:'',condition:'',notes:''},{id:uid(),name:'Stormbringer',type:'A confirmar',level:60,passive:'',condition:'',notes:''}],materials:[{id:uid(),name:'Poção de limite (personagem)',amount:0},{id:uid(),name:'Poção de limite (arma)',amount:0},{id:uid(),name:'Ouro',amount:0},{id:uid(),name:'Poções de experiência',amount:0}],teams:[{id:uid(),name:'Perry + Dark Lancelot',slots:[]}],costs:[200,220,350,450,600,850]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
if(!Array.isArray(db.characters)||!Array.isArray(db.weapons))db=fresh();
let detailId=null,detailTab='skills';let page='dashboard',editId=null,kind='characters',teamId=db.teams[0]?.id||'',search='',element='Todos';
function save(){localStorage.setItem(KEY,JSON.stringify(db));const s=document.getElementById('status');s.textContent='✓ Dados salvos no navegador';}
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function option(v,label,chosen){return '<option value="'+esc(v)+'" '+(String(chosen)===String(v)?'selected':'')+'>'+esc(label)+'</option>'}
function toast(s){document.getElementById('status').textContent=s}
function navigate(p){page=p;editId=null;detailId=null;search='';render()}
function navBtn(p,label){return '<button class="'+(page===p?'active':'')+'" onclick="navigate(\''+p+'\')">'+label+'</button>'}
function render(){document.getElementById('title').textContent=({dashboard:'Visão geral',characters:'Personagens',detail:'Ficha do personagem',catalog:'Catálogo geral',weapons:'Armas',materials:'Inventário',calc:'Calculadora de evolução',teams:'Batalhões',settings:'Configurações'})[page];document.getElementById('nav').innerHTML=[['dashboard','◈ Dashboard'],['characters','♙ Personagens'],['catalog','📚 Catálogo geral'],['weapons','⚔ Armas'],['materials','◈ Inventário'],['calc','✦ Calculadora'],['teams','♜ Times de 8'],['settings','⚙ Configurações']].map(x=>navBtn(...x)).join('');document.getElementById('app').innerHTML=({dashboard:dashboard,characters:()=>list('characters'),detail:detailPage,catalog:catalogPage,weapons:()=>list('weapons'),materials:materials,calc:calculator,teams:teams,settings:settings})[page]();}
function panel(title,content){return '<section class="panel"><h2>'+title+'</h2>'+content+'</section>'}
function dashboard(){const owned=db.characters.filter(x=>x.owned);return '<div class="stats">'+[['Personagens',owned.length],['Armas',db.weapons.length],['Times',db.teams.length],['Materiais',db.materials.length]].map(x=>'<div class="panel"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('')+'</div><div class="split">'+panel('Minha coleção','<p>Suas unidades estão pré-cadastradas como rascunho a partir da conversa. Confira os níveis e a versão.</p><div class="cards">'+owned.slice(0,6).map(characterCard).join('')+'</div><p><button class="primary" onclick="navigate(\'characters\')">Ver personagens →</button></p>')+panel('Planeje seu próximo upgrade','<p>Selecione um personagem e calcule quantas poções de limite faltam. Ajuste custos e inventário sempre que necessário.</p><button class="primary" onclick="navigate(\'calc\')">Abrir calculadora →</button><hr style="border:0;border-top:1px solid #345;margin:24px 0"/><h3>Monte seu batalhão</h3><p>Organize 8 posições com personagens da sua coleção e anote a estratégia.</p><button onclick="navigate(\'teams\')">Abrir times →</button>')+'</div>'}
function portrait(src,emoji){const s=String(src||'').trim();return s&&(/^(https:\/\/)/i.test(s)||/^assets\/personagens\/[a-zA-Z0-9._-]+\.(png|jpg|jpeg|webp)$/.test(s))?'<img src="'+esc(s)+'" alt="Retrato do personagem" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.style.display=\'none\';this.parentElement.append(\'✦\')"/>':emoji;}
function characterCard(c){return '<div class="character" onclick="showDetail(\''+c.id+'\')"><div class="avatar">'+portrait(c.imageUrl,({'Fogo':'🔥','Água':'💧','Luz':'☀️','Trevas':'🌙','Raio':'⚡','Terra':'🌿'}[c.element]||'✦'))+'</div><span class="tag">'+esc(c.rarity)+'</span> <small>'+esc(c.element)+'</small><b>'+esc(c.name)+'</b><small>Lv. '+Number(c.level||1)+' · Limite '+Number(c.limit||80)+'</small><div style="margin-top:11px"><button onclick="event.stopPropagation();openCharForm(\''+c.id+'\')">Editar ficha</button></div></div>'}
function list(type){kind=type;const a=db[type];return '<div class="toolbar"><input placeholder="Buscar..." value="'+esc(search)+'" oninput="search=this.value;renderList()"/><button class="primary" onclick="'+(type==='characters'?'openCharForm(null)':'editItem(\'weapons\',null)')+'">+ Adicionar '+(type==='characters'?'personagem':'arma')+'</button></div><div id="listing"></div><div id="editor"></div>' + (setTimeout(()=>renderList(),0),'')}
function renderList(){const out=document.getElementById('listing');if(!out)return;const filtered=db[kind].filter(x=>(x.name||'').toLowerCase().includes(search.toLowerCase()));out.innerHTML=kind==='characters'?'<div class="cards">'+filtered.map(characterCard).join('')+'</div>':'<div class="stack">'+filtered.map(w=>'<div class="item row between"><div><strong>⚔ '+esc(w.name)+'</strong><div class="note">'+esc(w.type)+' · Lv. '+w.level+' · '+esc(w.passive||'Passiva não cadastrada')+'</div><div class="note">Condição: '+esc(w.condition||'não informada')+'</div></div><button onclick="editItem(\'weapons\',\''+w.id+'\')">Editar</button></div>').join('')+'</div>';if(editId)renderEditor();}
function editItem(type,id){kind=type;editId=id||'new';renderEditor();document.getElementById('editor')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderEditor(){const root=document.getElementById('editor');if(!root)return;let x=db[kind].find(z=>z.id===editId)||{};root.innerHTML=panel(editId==='new'?'Adicionar':'Editar '+esc(x.name||'ficha'),kind==='characters'?'<form onsubmit="submitEdit(event)"><div class="fields">'+field('Nome','name',x.name||'',true)+field('URL da imagem (https)','imageUrl',x.imageUrl||'')+field('Elemento','element',x.element||'')+field('Nível atual','level',x.level||1,false,'number')+field('Limite desbloqueado','limit',x.limit||80,false,'number')+field('Raridade','rarity',x.rarity||'SSR')+field('Despertares','awakenings',x.awakenings||0,false,'number')+'<div><label>Arma equipada</label><select name="weaponId">'+option('','Nenhuma',x.weaponId)+db.weapons.map(w=>option(w.id,w.name,x.weaponId)).join('')+'</select></div><div><label>Na minha coleção</label><select name="owned">'+option('true','Sim',String(x.owned??true))+option('false','Não',String(x.owned??true))+'</select></div>'+field('Observações / habilidades','notes',x.notes||'')+'</div>'+actions()+'</form>':'<form onsubmit="submitEdit(event)"><div class="fields">'+field('Nome da arma','name',x.name||'',true)+field('Tipo','type',x.type||'')+field('Nível','level',x.level||1,false,'number')+field('Habilidade passiva','passive',x.passive||'')+field('Condição do bônus','condition',x.condition||'')+field('Observações','notes',x.notes||'')+'</div>'+actions()+'</form>');}
function field(label,name,value,required=false,type='text'){return '<div><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'/></div>'}
function actions(){return '<div class="row" style="margin-top:15px"><button type="submit" class="primary">Salvar</button><button type="button" onclick="editId=null;document.getElementById(\'editor\').innerHTML=\'\'">Cancelar</button>'+(editId!=='new'?'<button type="button" class="danger" onclick="removeItem()">Excluir</button>':'')+'</div>'}
function submitEdit(e){e.preventDefault();const f=new FormData(e.target),x={};for(const [k,v] of f.entries())x[k]=v;['level','limit','awakenings'].forEach(k=>{if(k in x)x[k]=Math.max(0,Number(x[k])||0)});if(kind==='characters')x.owned=x.owned==='true';if(editId==='new'){x.id=uid();db[kind].push(x)}else Object.assign(db[kind].find(y=>y.id===editId),x);editId=null;save();render()}
function removeItem(){if(!confirm('Excluir esta ficha?'))return;db[kind]=db[kind].filter(x=>x.id!==editId);editId=null;save();render()}
function materials(){return panel('Seus materiais','<p>Registre quantos itens você tem. Os números são editáveis, pois o site não lê sua conta no jogo.</p><div class="stack">'+db.materials.map(m=>'<div class="item row between"><strong>'+esc(m.name)+'</strong><div class="row"><input style="max-width:170px" aria-label="Quantidade" type="number" min="0" value="'+m.amount+'" onchange="changeMaterial(\''+m.id+'\',this.value)"/><button class="danger" onclick="deleteMaterial(\''+m.id+'\')">Excluir</button></div></div>').join('')+'</div><form class="row" style="margin-top:17px" onsubmit="addMaterial(event)"><input style="max-width:300px" name="name" placeholder="Novo material" required/><button class="primary">Adicionar material</button></form>')}
function changeMaterial(id,v){db.materials.find(x=>x.id===id).amount=Math.max(0,Number(v)||0);save()}
function deleteMaterial(id){db.materials=db.materials.filter(x=>x.id!==id);save();render()}
function addMaterial(e){e.preventDefault();db.materials.push({id:uid(),name:new FormData(e.target).get('name'),amount:0});save();render()}
const limits=[80,100,120,140,160,180,200];
function calculator(){let own=db.materials.find(x=>x.name==='Poção de limite (personagem)')?.amount||0;return panel('Calculadora de limite — SSR','<p class="hint">A tabela começa com valores de referência editáveis (80→100: 200; 100→120: 220; 120→140: 350; 140→160: 450; 160→180: 600; 180→200: 850). Não inclui experiência, ouro ou outros materiais.</p><div class="fields"><div><label>Personagem</label><select id="calcChar" onchange="calcChange()">'+db.characters.map(c=>option(c.id,c.name,'')).join('')+'</select></div><div><label>Limite desejado</label><select id="calcTarget" onchange="calcChange()">'+limits.map(n=>option(n,n,200)).join('')+'</select></div></div><div id="calcResult" style="margin:18px 0"></div><h3>Custos por avanço (poções)</h3><div class="fields">'+db.costs.map((v,i)=>'<div><label>'+limits[i]+' → '+limits[i+1]+'</label><input type="number" min="0" value="'+v+'" onchange="db.costs['+i+']=Math.max(0,Number(this.value)||0);save();calcChange()"/></div>').join('')+'</div><p class="note">Você tem '+own+' poções de limite no inventário. Atualize na aba Inventário.</p>')+(setTimeout(calcChange,0),'')}
function calcChange(){const el=document.getElementById('calcResult'),c=db.characters.find(x=>x.id===document.getElementById('calcChar')?.value);if(!el||!c)return;const target=Number(document.getElementById('calcTarget').value),current=Number(c.limit||80),a=limits.indexOf(current),b=limits.indexOf(target),cost=a>=0&&b>a?db.costs.slice(a,b).reduce((x,y)=>x+Number(y),0):0,owned=db.materials.find(x=>x.name==='Poção de limite (personagem)')?.amount||0;el.innerHTML='<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[['Limite atual',current],['Poções necessárias',cost],['Poções faltantes',Math.max(0,cost-owned)]].map(x=>'<div class="item"><small class="muted">'+x[0]+'</small><div style="font-size:24px;color:var(--gold)">'+x[1]+'</div></div>').join('')+'</div><div class="progress" style="margin-top:13px"><i style="width:'+Math.min(100,cost?owned/cost*100:100)+'%"></i></div>'}
function teams(){if(!db.teams.length)db.teams=[{id:uid(),name:'Meu batalhão',slots:[]}];if(!db.teams.some(x=>x.id===teamId))teamId=db.teams[0].id;const team=db.teams.find(x=>x.id===teamId);return panel('Batalhões de 8 personagens','<div class="toolbar"><select onchange="teamId=this.value;render()">'+db.teams.map(t=>option(t.id,t.name,teamId)).join('')+'</select><button onclick="addTeam()">+ Novo time</button><button class="danger" onclick="deleteTeam()">Excluir time</button></div><div><label>Nome da formação</label><input style="max-width:450px" value="'+esc(team.name)+'" onchange="renameTeam(this.value)"/></div><p class="note">Os quatro primeiros começam em campo; posições 5–8 são reforços. Cada personagem pode aparecer apenas uma vez no mesmo time.</p><div class="teamgrid">'+Array.from({length:8},(_,i)=>'<div class="slot"><strong>'+(i+1)+'. '+(i<4?'Inicial':'Reforço')+'</strong><select onchange="setSlot('+i+',this.value)">'+option('','— Vazio —',team.slots[i]||'')+db.characters.filter(c=>c.owned&&(team.slots[i]===c.id||!team.slots.includes(c.id))).map(c=>option(c.id,c.name+' · Lv. '+c.level,team.slots[i])).join('')+'</select></div>').join('')+'</div>') }
function addTeam(){const t={id:uid(),name:'Novo batalhão',slots:[]};db.teams.push(t);teamId=t.id;save();render()}
function deleteTeam(){if(!confirm('Excluir este batalhão?'))return;db.teams=db.teams.filter(x=>x.id!==teamId);teamId=db.teams[0]?.id;save();render()}
function renameTeam(v){db.teams.find(x=>x.id===teamId).name=v;save()}
function setSlot(i,id){const t=db.teams.find(x=>x.id===teamId);if(id&&t.slots.some((x,j)=>x===id&&j!==i)){toast('Este personagem já está no batalhão.');render();return}t.slots[i]=id;save();render()}

function catalogPage(){
 setTimeout(loadCatalog,0);
 return panel('Biblioteca de personagens','<p>Catálogo comunitário inicial com nomes em português e elementos. Nem todas as versões, habilidades e imagens foram verificadas. Esta lista não altera sua coleção automaticamente.</p><div class="toolbar"><input id="catalogSearch" placeholder="Buscar nome..." oninput="filterCatalog()"/><select id="catalogElement" onchange="filterCatalog()"><option value="">Todos os elementos</option>'+['Fogo','Água','Terra','Raio','Luz','Trevas'].map(x=>option(x,x,'')).join('')+'</select><select id="catalogRarity" onchange="filterCatalog()"><option value="">Todas as raridades</option>'+['SSR','SR','R','N','Invocação SSR'].map(x=>option(x,x,'')).join('')+'</select></div><p class="note" id="catalogCount">Carregando...</p><div class="cards" id="catalogCards"></div><p class="note">Fonte: <a style="color:#87cde9" href="https://evertale-wiki.jp/%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E4%B8%80%E8%A6%A7/" target="_blank" rel="noopener">Evertale Wiki (japonês)</a>. Traduções e versões precisam de revisão. O site não importa dados oficiais da sua conta.</p>');
}
let catalogEntries=[];
async function loadCatalog(){
 try {const res=await fetch('./catalogo.json');if(!res.ok)throw Error('Falha ao carregar');catalogEntries=await res.json();
 const portraitNames={'Perry — Admiral of Debt':'Perry — Admiral of Debt','Dark Lancelot':'Dark Lancelot — Black-Hearted Gunslinger','Mirai':'Mirai — Sparkling Idol'};
 let modified=false;
 for(const entry of catalogEntries){const name=portraitNames[entry.name]||entry.name;const owned=db.characters.find(c=>c.name===name);if(!owned)continue;if(!owned.imageUrl&&entry.imageUrl){owned.imageUrl=entry.imageUrl;modified=true}if(!owned.story&&entry.story){owned.story=entry.story;modified=true}if((!owned.skills||!owned.skills.length)&&entry.skills?.length){owned.skills=entry.skills;modified=true}if(!Array.isArray(owned.evolutionImages)){owned.evolutionImages=[owned.imageUrl||entry.imageUrl||'',...(entry.evolutionImages||[]).slice(1,3)];modified=true}else if(entry.evolutionImages){for(let i=0;i<3;i++){if(!owned.evolutionImages[i]&&entry.evolutionImages[i]){owned.evolutionImages[i]=entry.evolutionImages[i];modified=true}}}}
 if(modified){save();if(page==='detail')render()}
 filterCatalog()}
 catch(err){const el=document.getElementById('catalogCount');if(el)el.textContent='Não foi possível carregar catalogo.json. Para testar localmente, execute um servidor HTTP ou abra pela publicação no GitHub Pages.'}
}
function filterCatalog(){
 const root=document.getElementById('catalogCards');if(!root)return;
 const q=(document.getElementById('catalogSearch')?.value||'').toLowerCase(),elem=document.getElementById('catalogElement')?.value||'',rarity=document.getElementById('catalogRarity')?.value||'';
 const out=catalogEntries.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!elem||c.element===elem)&&(!rarity||c.rarity===rarity));
 document.getElementById('catalogCount').textContent=out.length+' de '+catalogEntries.length+' registros importados';
 root.innerHTML=out.map(c=>'<div class="character"><div class="avatar">'+portrait(c.imageUrl,({'Fogo':'🔥','Água':'💧','Luz':'☀️','Trevas':'🌙','Raio':'⚡','Terra':'🌿'}[c.element]||'✦'))+'</div><span class="tag">'+esc(c.rarity)+'</span> <small>'+esc(c.element)+'</small><b>'+esc(c.name)+'</b><small>Habilidades ainda não cadastradas</small><div style="margin-top:11px"><button onclick="addCatalogEntry('+c.id+')">+ Tenho esse</button></div></div>').join('');
}
function addCatalogEntry(id){
 const c=catalogEntries.find(x=>x.id===id);if(!c)return;
 if(db.characters.some(x=>x.name.toLowerCase()===c.name.toLowerCase())){toast('Este nome já está na sua coleção. Confira a ficha na aba Personagens.');return}
 db.characters.push({id:uid(),name:c.name,element:c.element,level:1,rarity:c.rarity,owned:true,limit:80,awakenings:0,weaponId:'',notes:'Adicionado da biblioteca comunitária; confirme a versão.',imageUrl:c.imageUrl||'',evolutionImages:c.evolutionImages||[c.imageUrl||'','',''],story:c.story||'',skills:c.skills||[]});save();toast(c.name+' adicionado à sua coleção!');
}


function showDetail(id){detailId=id;detailTab='skills';page='detail';render()}
function evolutionImages(c){const list=Array.isArray(c.evolutionImages)?c.evolutionImages:[];return Array.from({length:3},(_,i)=>list[i]||(i===0?c.imageUrl:''));}
function evolutionGallery(c){const pics=evolutionImages(c);return '<h3>Galeria de evolução</h3><div class="evolGallery">'+pics.map((src,i)=>'<div class="evolStage"><div class="avatar">'+(src?portrait(src,'✦'):'<span class="muted">Imagem pendente</span>')+'</div><small>Arte '+(i+1)+'</small></div>').join('')+'</div><p class="note">As três artes devem pertencer à mesma versão do personagem. Nenhuma imagem é inventada.</p>'}
let activeEvolution=0;
function selectEvolution(i){activeEvolution=i;render()}
function detailPage(){
 const c=db.characters.find(x=>x.id===detailId);if(!c)return panel('Personagem não encontrado','<button onclick="navigate(\'characters\')">Voltar</button>');
 const emoji=({'Fogo':'🔥','Água':'💧','Luz':'☀️','Trevas':'🌙','Raio':'⚡','Terra':'🌿'}[c.element]||'✦');
 const images=evolutionImages(c),selected=images[activeEvolution]||images.find(Boolean)||c.imageUrl;
 const main='<div class="detailHero"><div class="detailPortrait">'+portrait(selected,emoji)+'</div><div><div class="row"><span class="tag">'+esc(c.rarity)+'</span><span class="tag">'+esc(c.element)+'</span><span class="tag">Nv. '+Number(c.level||1)+'</span></div><h1 style="margin:16px 0">'+esc(c.name)+'</h1><p>Limite desbloqueado: '+Number(c.limit||80)+' · Despertares: '+Number(c.awakenings||0)+'</p><div class="row"><button class="primary" onclick="openCharForm(\''+c.id+'\')">✎ Editar ficha</button><button onclick="toggleOwned(\''+c.id+'\')">'+(c.owned?'✓ Na minha coleção':'♡ Adicionar à coleção')+'</button></div></div></div>';
 const gallery='<h3 style="margin-top:24px">Formas do personagem</h3><div class="evolGallery">'+images.map((src,i)=>'<button type="button" class="evolStage '+(i===activeEvolution?'active':'')+'" onclick="selectEvolution('+i+')"><div class="avatar">'+(src?portrait(src,'✦'):'<span class="muted">Imagem ainda não encontrada</span>')+'</div><small>Forma '+(i+1)+(i===0?' · inicial':i===2?' · final':' · evoluída')+'</small></button>').join('')+'</div><p class="note">As formas 2 e 3 serão exibidas após a confirmação das imagens corretas desta versão.</p>'+(c.evolutionReference?.url?'<p><a href="'+esc(c.evolutionReference.url)+'" target="_blank" rel="noopener noreferrer" style="color:#8cd8ee">Consultar imagens das três formas na fonte ↗</a></p>':'');
 const tabs='<div class="tabRow">'+[['skills','Habilidades'],['history','História'],['weapons','Armas'],['evolution','Evolução']].map(t=>'<button class="'+(detailTab===t[0]?'selected':'')+'" onclick="detailTab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>';
 return panel('‹ <a href="#" onclick="navigate(\'characters\');return false" style="color:#8cd8ee">Voltar aos personagens</a>',main+gallery+tabs+detailBody(c));
}
function detailBody(c){
 if(detailTab==='skills')return '<h3>Habilidades</h3>'+((c.skills||[]).length?(c.skills||[]).map(s=>'<div class="item"><strong>'+esc(s.name)+'</strong><span class="tag" style="margin-left:10px">'+esc(s.type)+'</span><p>'+esc(s.description)+'</p></div>').join(''):'<p>As habilidades desta versão ainda não foram cadastradas. Adicione-as na ficha para evitar confundir versões do jogo.</p>');
 if(detailTab==='history')return '<h3>História</h3><p style="white-space:pre-wrap">'+esc(c.story||'História ainda não cadastrada para esta versão.')+'</p>';
 if(detailTab==='weapons'){const w=db.weapons.find(x=>x.id===c.weaponId);return '<h3>Arma equipada</h3><p>'+(w?esc(w.name)+' — '+esc(w.passive||'Passiva não cadastrada'):'Nenhuma arma cadastrada')+'</p><button onclick="navigate(\'weapons\')">Ver armas</button>';}
 return '<h3>Evolução</h3><p>Nível atual '+Number(c.level||1)+' / limite '+Number(c.limit||80)+'</p><button onclick="navigate(\'calc\')">Abrir calculadora de evolução</button>';
}
function toggleOwned(id){const c=db.characters.find(x=>x.id===id);if(!c)return;c.owned=!c.owned;save();render()}
function openCharForm(id){
 const c=db.characters.find(x=>x.id===id)||{name:'',element:'Fogo',rarity:'SSR',level:1,limit:80,awakenings:0,owned:true,skills:[]};
 const m=document.getElementById('modalRoot');
 m.innerHTML='<div class="modalShade" onclick="closeCharForm()"><div class="modalBox" onclick="event.stopPropagation()"><div class="row between"><h2>'+(id?'Editar personagem':'Adicionar personagem')+'</h2><button onclick="closeCharForm()">✕</button></div><form onsubmit="saveCharForm(event,\''+(id||'')+'\')"><div class="fields">'+field('Nome e versão','name',c.name,true)+'<div><label>Elemento</label><select name="element">'+['Fogo','Água','Terra','Raio','Luz','Trevas'].map(x=>option(x,x,c.element)).join('')+'</select></div><div><label>Raridade</label><select name="rarity">'+['SSR','SR','R','N'].map(x=>option(x,x,c.rarity)).join('')+'</select></div>'+field('Nível atual','level',c.level,false,'number')+field('Limite de nível','limit',c.limit,false,'number')+field('Despertares','awakenings',c.awakenings,false,'number')+field('URL do retrato (https)','imageUrl',c.imageUrl||'')+field('Arte 1 — forma inicial','evo1',(c.evolutionImages||[])[0]||c.imageUrl||'')+field('Arte 2 — evolução','evo2',(c.evolutionImages||[])[1]||'')+field('Arte 3 — evolução final','evo3',(c.evolutionImages||[])[2]||'')+'<div><label>Na minha coleção?</label><select name="owned">'+option('true','Sim',String(c.owned))+option('false','Não',String(c.owned))+'</select></div><div class="wide"><label>História do personagem</label><textarea name="story" placeholder="História confirmada na fonte...">'+esc(c.story||'')+'</textarea></div><div class="wide"><label>Habilidades (uma por linha: Nome | Tipo | Descrição)</label><textarea name="skills" placeholder="Exemplo: Turn Gift | Ativa | Concede um turno...">'+esc((c.skills||[]).map(s=>s.name+' | '+s.type+' | '+s.description).join('\n'))+'</textarea></div><div class="wide"><label>Observações</label><textarea name="notes">'+esc(c.notes||'')+'</textarea></div></div><div class="row" style="margin-top:15px"><button type="button" onclick="closeCharForm()">Cancelar</button><button class="primary" type="submit">Salvar personagem</button></div></form></div></div>';
}
function closeCharForm(){document.getElementById('modalRoot').innerHTML=''}
function saveCharForm(event,id){
 event.preventDefault();const v=Object.fromEntries(new FormData(event.target).entries());
 const c=id?db.characters.find(x=>x.id===id):{id:uid(),weaponId:''};if(!c)return;
 Object.assign(c,{name:v.name,element:v.element,rarity:v.rarity,level:Math.max(1,Number(v.level)||1),limit:Math.max(1,Number(v.limit)||80),awakenings:Math.max(0,Number(v.awakenings)||0),imageUrl:v.imageUrl,evolutionImages:[v.evo1||v.imageUrl,v.evo2||'',v.evo3||''],story:v.story,notes:v.notes,owned:v.owned==='true',skills:v.skills.split('\n').filter(Boolean).map(line=>{const [name,type,...desc]=line.split('|');return{name:(name||'').trim(),type:(type||'').trim(),description:desc.join('|').trim()}})});
 if(!id)db.characters.push(c);save();closeCharForm();if(!id)showDetail(c.id);else render();
}

function settings(){return panel('Dados e segurança','<p>Esta versão funciona sem login e sem servidor. Os dados são armazenados no navegador deste dispositivo. Faça backups regularmente.</p><div class="toolbar"><button onclick="exportData()">Exportar JSON</button><button onclick="document.getElementById(\'importFile\').click()">Importar JSON</button><button class="danger" onclick="resetData()">Recomeçar com catálogo de exemplo</button></div><p class="note">O catálogo inicial usa nomes informados nas conversas e níveis aproximados. Corrija sua coleção; as habilidades das armas não são preenchidas automaticamente.</p>')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='evertale-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text());if(!Array.isArray(json.characters)||!Array.isArray(json.weapons)||!Array.isArray(json.teams)||!Array.isArray(json.materials))throw Error('Backup inválido');if(!confirm('Substituir os dados atuais pelo backup?'))return;db=json;teamId=db.teams[0]?.id;save();render()}catch(err){toast('Não foi possível importar: '+err.message)}e.target.value=''}
function resetData(){if(!confirm('Apagar todas as suas edições neste navegador?'))return;db=fresh();teamId=db.teams[0].id;save();navigate('dashboard')}
render();loadCatalog();
</script></body></html>
